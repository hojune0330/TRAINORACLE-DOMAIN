name: Test fixture preflight (not deployment)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Read-only source verification commit, full SHA'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: trainoracle-fixture-preflight-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - timezone: UTC
            config: vitest.config.ts
          - timezone: Asia/Seoul
            config: vitest.config.kst.ts
    steps:
      - name: Validate source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Checkout verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - name: Checkout source without writing or deploying
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hojune0330/TRAINORACLE
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: source/app/package-lock.json
      - name: Install existing locked dependencies
        working-directory: source/app
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test only repaired fixtures, with isolated environment
        env:
          TEST_TIMEZONE: ${{ matrix.timezone }}
          TEST_CONFIG: ${{ matrix.config }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { resolve } from 'node:path';
          import { sourceTestEnvironment } from './publisher/scripts/prepare-domain.mjs';
          const env = sourceTestEnvironment(process.env);
          env.TZ = process.env.TEST_TIMEZONE;
          const cwd = resolve('source/app');
          const commands = [
            [resolve(cwd, 'node_modules/typescript/bin/tsc'), '--noEmit'],
            [resolve(cwd, 'node_modules/vitest/vitest.mjs'), 'run', '--config', process.env.TEST_CONFIG,
              'src/AppShell.home-oracle-status.contract.test.tsx',
              'src/components/Motion.contract.test.tsx',
              'src/screens/AutoAdvanceActivation.contract.test.tsx',
              'src/domain/deployment-config.contract.test.ts',
              'src/domain/plan-beta-store.test.ts',
              'src/screens/home/HomeJournalReadiness.contract.test.tsx',
              'src/screens/plan-beta/ActivePlan.adaptation.contract.test.tsx',
              'src/screens/plan-beta/ActivePlan.plan-link.contract.test.tsx',
              'src/screens/plan-beta/catalog-execution-targets.contract.test.tsx',
              'src/screens/LogEntry.contract.test.tsx',
              'src/domain/private-memo-preparation.test.tsx',
              'src/screens/log-entry/EmptySave.contract.test.tsx',
              'src/screens/log-entry/FormInputAutosave.test.tsx',
              'src/screens/log-entry/PurposeScopedMemoField.account.test.tsx',
              'src/screens/plan-beta/PlanSchedulePreview.contract.test.tsx'],
          ];
          for (const args of commands) {
            const result = spawnSync(process.execPath, args, { cwd, env, stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
      # This preflight never replaces the full source CI or publisher gates.
      # It has no Pages permissions, artifacts, backend deployment or source writes.
